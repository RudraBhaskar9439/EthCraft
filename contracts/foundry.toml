[profile.default]
src = "src"
test = "../tests/contracts"
out = "out"
cache_path = "cache"
libs = ["node_modules"]
allow_paths = ["../tests/contracts", "src"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
gas_limit = 1000000000
fs_permissions = [{ access = "read-write", path = "./" }]
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "@uniswap/v4-core/=node_modules/@uniswap/v4-core/",
  "@uniswap/v4-periphery/=node_modules/@uniswap/v4-periphery/",
  "solmate/=node_modules/@uniswap/v4-core/lib/solmate/",
  "forge-std/=node_modules/@uniswap/v4-core/lib/forge-std/src/",
  "agentcity/=src/"
]
